<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{--b:#2C2CFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:inherit}
html,body{height:100%;background:#000;color:#fff;font-family:'Vazirmatn',Tahoma,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;position:relative;
 background:
  radial-gradient(ellipse at 50% 45%,rgba(44,44,255,.28),transparent 60%),
  radial-gradient(rgba(44,44,255,.35) 1px,transparent 1.5px) 0 0/28px 28px,#000}
body::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,#000 100%)}
.frame{position:absolute;inset:18px;border:1px solid rgba(44,44,255,.35);z-index:1;pointer-events:none}
.frame i{position:absolute;width:22px;height:22px;border:2px solid var(--b)}
.frame i:nth-child(1){top:-1px;left:-1px;border-right:0;border-bottom:0}
.frame i:nth-child(2){top:-1px;right:-1px;border-left:0;border-bottom:0}
.frame i:nth-child(3){bottom:-1px;left:-1px;border-right:0;border-top:0}
.frame i:nth-child(4){bottom:-1px;right:-1px;border-left:0;border-top:0}
.tag{position:absolute;top:38px;left:0;right:0;text-align:center;z-index:2;direction:ltr;font-size:12px;letter-spacing:.4em;color:rgba(255,255,255,.4);font-weight:500}
.tag b{color:var(--b);font-weight:800}
main{position:relative;z-index:2;text-align:center;padding:0 24px}
.num{direction:ltr;display:inline-flex;align-items:center;justify-content:center;gap:.04em;
 font-size:clamp(100px,25vw,260px);font-weight:800;line-height:1;letter-spacing:-.03em}
.num svg{height:1em;width:.72em;flex:none;overflow:visible;filter:drop-shadow(0 0 14px rgba(44,44,255,.8))}
.radar{width:.95em;height:.95em;flex:none;border-radius:50%;border:.025em solid var(--b);position:relative;margin:0 .08em;
 box-shadow:0 0 40px rgba(44,44,255,.55),inset 0 0 30px rgba(44,44,255,.35);
 background:repeating-radial-gradient(circle,transparent 0 .11em,rgba(44,44,255,.28) .11em .115em)}
.radar::before{content:"";position:absolute;inset:0;border-radius:50%;
 background:conic-gradient(from 0deg,rgba(44,44,255,.85),rgba(44,44,255,0) 28%,transparent);animation:spin 3s linear infinite}
.radar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(44,44,255,.35);
 box-shadow:0 0 0 0 transparent}
.blip{position:absolute;width:.045em;height:.045em;border-radius:50%;background:#fff;top:28%;left:64%;box-shadow:0 0 12px #fff;animation:blip 3s linear infinite;z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%,100%{opacity:0}8%{opacity:1}45%{opacity:0}}
.msg{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:34px}
.msg::before,.msg::after{content:"";height:1px;width:min(90px,14vw);background:linear-gradient(90deg,transparent,var(--b))}
.msg::after{transform:scaleX(-1)}
p{font-weight:500;font-size:clamp(19px,4.2vw,34px);line-height:1.7}
p b{color:var(--b);font-weight:800;text-shadow:0 0 22px rgba(44,44,255,.9)}
footer{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;z-index:2;direction:ltr;font-weight:300;font-size:12px;letter-spacing:.4em;color:rgba(255,255,255,.13)}
</style>
</head>
<body>
<div class="frame"><i></i><i></i><i></i><i></i></div>
<div class="tag">ERROR <b>/</b> PAGE NOT FOUND</div>
<main>
  <div class="num"><svg viewBox="0 0 72 100" fill="none" stroke="#2C2CFF" stroke-width="2.6"><path d="M50 0 L2 66 H70 M50 0 V100"/></svg><div class="radar"><div class="blip"></div></div><svg viewBox="0 0 72 100" fill="none" stroke="#2C2CFF" stroke-width="2.6"><path d="M50 0 L2 66 H70 M50 0 V100"/></svg></div>
  <div class="msg"><p>گشتم نبود، <b>نگرد نیست...!</b></p></div>
</main>
<footer>KianAfraz</footer>
</body>
</html>
