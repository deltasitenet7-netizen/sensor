<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>۴۰۴ | مسیر پیدا نشد</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #d1d1d1;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            font-size: 8rem;
            margin: 0;
            color: #ff4757; /* رنگ قرمز ملایم برای خطای سیستمی */
            letter-spacing: -5px;
        }
        p {
            font-size: 1.2rem;
            margin: 20px 0;
            color: #888;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: transparent;
            border: 1px solid #d1d1d1;
            color: #d1d1d1;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        a:hover {
            background-color: #d1d1d1;
            color: #0a0a0a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>به نظر می‌رسد این مسیر وجود ندارد یا به جای دیگری منتقل شده است.</p>
        <a href="/">بازگشت به صفحه اصلی</a>
    </div>
</body>
</html>
