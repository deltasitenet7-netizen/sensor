<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>404 | یافت نشد</title>
    <style>
        :root {
            --disco-blue: #00f2ff; 
            --bg-color: #050505;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .code-404 {
            font-size: 15rem;
            font-weight: 900;
            margin: 0;
            color: var(--disco-blue);
            text-shadow: 0 0 30px rgba(0, 242, 255, 0.5);
            letter-spacing: -10px;
        }
        .message {
            font-size: 1.5rem;
            margin-top: -20px;
            color: #ccc;
            font-weight: 300;
        }
        .home-link {
            margin-top: 30px;
            color: var(--disco-blue);
            text-decoration: none;
            border: 1px solid var(--disco-blue);
            padding: 10px 20px;
            transition: 0.3s;
        }
        .home-link:hover {
            background: var(--disco-blue);
            color: black;
        }
        .footer-name {
            position: absolute;
            bottom: 20px;
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <h1 class="code-404">404</h1>
    <p class="message">اینجا هیچی نیست...!</p>
    <a href="/" class="home-link">برگشت به ریشه</a>

    <div class="footer-name">kianAfraz</div>

</body>
</html>
