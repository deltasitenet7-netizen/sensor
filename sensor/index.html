  <title>سنسور | افزونه هوشمند تخفیف براساس الگوی بازدید کاربر</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{background:#f8d5e6}
    body.is-loading{overflow:hidden}
    .preloader{position:fixed;z-index:1000;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 35% 65%,#fff8fb 0%,#fbd9e9 45%,#f8bad7 100%);transition:opacity .7s ease,visibility .7s;will-change:opacity}
    .preloader.is-complete{opacity:0;visibility:hidden;pointer-events:none}
    .preloader__halo{position:absolute;width:min(75vw,780px);aspect-ratio:1;border:1px solid rgba(255,255,255,.6);border-radius:50%;box-shadow:0 0 0 85px rgba(255,255,255,.035),0 0 0 170px rgba(255,255,255,.028)}
    .preloader__center{position:relative;width:min(68vw,580px)}
    .preloader__wordmark{display:block;width:100%;height:auto;overflow:visible;color:#573049}
    .preloader__wordmark path{fill:currentColor;opacity:0;transform:translate3d(-46px,0,0)}
    .preloader.is-playing .preloader__wordmark path{animation:letter-arrive .72s cubic-bezier(.22,.9,.3,1) forwards}
    .preloader.is-playing .preloader__wordmark path:nth-child(2){animation-delay:.12s}
    .preloader.is-playing .preloader__wordmark path:nth-child(3){animation-delay:.24s}
    .preloader.is-playing .preloader__wordmark path:nth-child(4){animation-delay:.36s}
    .preloader.is-playing .preloader__wordmark path:nth-child(5){animation-delay:.48s}
    .preloader.is-playing .preloader__wordmark path:nth-child(6){animation-delay:.6s}
    @keyframes letter-arrive{to{opacity:1;transform:translate3d(0,0,0)}}
    .preloader__track{margin-top:2rem;height:2px;background:rgba(130,57,86,.16);overflow:hidden}
    .preloader__track span{display:block;width:100%;height:100%;background:#823956;transform-origin:right;transform:scaleX(0);will-change:transform}
    .preloader.is-playing .preloader__track span{animation:load-line 1.32s cubic-bezier(.4,0,.2,1) forwards}
    @keyframes load-line{to{transform:scaleX(1)}}
    .load-error{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);border:0;padding:12px 22px;background:#573049;color:white;font:16px sans-serif;cursor:pointer}
    #app{min-height:100svh}
    @media(prefers-reduced-motion:reduce){.preloader__wordmark path{opacity:1;transform:none}.preloader.is-playing .preloader__wordmark path,.preloader.is-playing .preloader__track span{animation:none}.preloader__track span{transform:scaleX(1)}}
  </style>
</head>

  <div id="app" aria-hidden="true"></div>
  <noscript>برای نمایش صفحه، جاوااسکریپت را فعال کنید.</noscript>
  <script>
    (() => {
      const loader = document.getElementById('preloader');
      const app = document.getElementById('app');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const frame = () => new Promise(r => requestAnimationFrame(() => r()));
      const css = new Promise((resolve, reject) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './styles.css';
        link.media = 'print';
        link.onload = () => resolve(link);
        link.onerror = reject;
        document.head.append(link);
      });
      const markup = fetch('./page.html').then(response => {
        if (!response.ok) throw new Error('Page did not load');
        return response.text();
      });
      const started = frame().then(frame).then(() => { loader.classList.add('is-playing'); });
      const minimum = started.then(() => new Promise(resolve => setTimeout(resolve, reduce ? 60 : 1750)));
      Promise.all([minimum, markup, css]).then(async ([, html, link]) => {
        link.media = 'all';
        app.innerHTML = html;
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = './main.js';
          script.onload = resolve;
          script.onerror = reject;
          document.body.append(script);
        });
        await Promise.all([
          document.fonts.load('800 48px Abar'),
          document.fonts.load('600 20px Yekan')
        ]).catch(() => {});
        await frame(); await frame();
        app.removeAttribute('aria-hidden');
        document.body.classList.remove('is-loading');
        document.dispatchEvent(new Event('sensor:ready'));
        loader.classList.add('is-complete');
        setTimeout(() => loader.remove(), 850);
      }).catch(() => {
        const retry = document.createElement('button');
        retry.className = 'load-error';
        retry.textContent = 'بارگذاری نشد؛ تلاش دوباره';
        retry.onclick = () => location.reload();
        loader.append(retry);
      });
    })();
  </script>
